# Pivot's own Dependabot config (release-kit apply leaves a file it did not write alone).
# Weekly grouped updates for Pivot's dependencies and actions, plus release-kit's
# multi-ecosystem group: a new kit release arrives as one PR that moves the dev
# dependency (npm) and the workflow pins (github-actions) together. The kit is excluded
# from the default cooldown, which would otherwise propose a downgrade to an older tag.
version: 2
multi-ecosystem-groups:
  release-kit:
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    patterns: ["release-kit"]
    multi-ecosystem-group: release-kit
    cooldown:
      exclude: ["release-kit"]
    groups:
      # Minor and patch only: a major arrives in its own pull request, so one
      # breaking update (TypeScript 7 in #15) can't hold back the rest, and
      # the grouped minors can merge on their own (auto-merge.yml).
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["release-kit"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["n8watkins/release-kit*"]
    multi-ecosystem-group: release-kit
    cooldown:
      exclude: ["n8watkins/release-kit*"]
    groups:
      github-actions:
        patterns: ["*"]
        exclude-patterns: ["n8watkins/release-kit*"]
