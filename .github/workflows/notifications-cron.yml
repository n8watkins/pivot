name: Notification check-ins

# Hourly trigger for /api/cron/notifications, which sends due check-ins at 09:00 local time.
# This runs on a GitHub-hosted runner instead of Vercel Cron because the Vercel Hobby plan
# only allows daily crons. It does nothing until the CRON_SECRET repository secret is set
# to the same value as the CRON_SECRET Vercel production variable.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: notifications-cron
  cancel-in-progress: false

jobs:
  trigger:
    if: github.repository == 'n8watkins/pivot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due check-ins
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PIVOT_URL: ${{ vars.PIVOT_URL || 'https://pivot-lilac-nu.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; check-ins are off. Nothing to do."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$PIVOT_URL/api/cron/notifications")
          cat response.json; echo
          if [ "$status" = 503 ]; then
            echo "::notice::Web Push is not configured on the deployment yet."
            exit 0
          fi
          test "$status" = 200
