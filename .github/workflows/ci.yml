name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, separately required check: the crisis phrase table and Gemini safety routing.
  # A regression here must never merge, so it runs on its own and fails loudly.
  safety:
    name: Crisis safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/crisis.test.ts src/lib/recommendation.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/pivot.spec.ts --grep "crisis|high-risk|idiom|specialized"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
        env:
          TURSO_DATABASE_URL: file:./data/ci.db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The Cloudflare Workers build: binding types match wrangler.jsonc, the
  # OpenNext build succeeds, and wrangler can bundle the Worker.
  worker:
    name: Worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Binding types match wrangler.jsonc
        run: npx wrangler types cloudflare-env.d.ts --env-interface CloudflareEnv --strict-vars=false --env-file .dev.vars.example --check
      - run: npm run build:worker
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir "${{ runner.temp }}/worker-bundle"
